<?xml version="1.0" encoding="UTF-8"?>
<!-- LIS3DH → LILYGO T-A7670E wiring. Pin order read from the unit-1 silkscreen
     (battery side, where the labels are printed). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="bold">LIS3DH → T-A7670E (paso 3)</text>
  <text x="600" y="68" text-anchor="middle" font-size="16" fill="#555">Placa vista por la cara de la batería (donde están impresas las etiquetas)</text>

  <!-- board -->
  <rect x="200" y="130" width="800" height="260" rx="14" fill="#1d1d1d"/>
  <text x="600" y="255" text-anchor="middle" font-size="20" fill="#bbb">LILYGO T-A7670E</text>
  <text x="600" y="282" text-anchor="middle" font-size="15" fill="#888">(portapilas 18650 en esta cara)</text>
  <text x="215" y="262" font-size="14" fill="#888">◀ extremo PY1</text>
  <text x="985" y="262" text-anchor="end" font-size="14" fill="#888">USB-C · ON/OFF ▶</text>

  <!-- top header -->
  <g font-size="12" fill="#ddd" text-anchor="middle">
    <g id="top">
      <circle cx="240" cy="160" r="9" fill="#c9a43a"/><text x="240" y="190">V3V3</text>
      <circle cx="288" cy="160" r="9" fill="#c9a43a"/><text x="288" y="190">GND</text>
      <circle cx="336" cy="160" r="9" fill="#666"/><text x="336" y="190">IO32</text>
      <circle cx="384" cy="160" r="9" fill="#666"/><text x="384" y="190">IO33</text>
      <circle cx="432" cy="160" r="9" fill="#c9a43a"/><text x="432" y="190">IO34</text>
      <circle cx="480" cy="160" r="9" fill="#666"/><text x="480" y="190">IO35</text>
      <circle cx="528" cy="160" r="9" fill="#666"/><text x="528" y="190">IO25</text>
      <circle cx="576" cy="160" r="9" fill="#666"/><text x="576" y="190">IO26</text>
      <circle cx="624" cy="160" r="9" fill="#666"/><text x="624" y="190">IO27</text>
      <circle cx="672" cy="160" r="9" fill="#666"/><text x="672" y="190">IO4</text>
      <circle cx="720" cy="160" r="9" fill="#666"/><text x="720" y="190">IO2</text>
      <circle cx="768" cy="160" r="9" fill="#666"/><text x="768" y="190">IO15</text>
      <circle cx="816" cy="160" r="9" fill="#666"/><text x="816" y="190">IO14</text>
      <circle cx="864" cy="160" r="9" fill="#666"/><text x="864" y="190">IO13</text>
      <circle cx="912" cy="160" r="9" fill="#666"/><text x="912" y="190">IO12</text>
      <circle cx="960" cy="160" r="9" fill="#666"/><text x="960" y="190">V_BAT</text>
    </g>
    <!-- bottom header -->
    <g id="bottom">
      <circle cx="240" cy="360" r="9" fill="#666"/><text x="240" y="340">TX</text>
      <circle cx="288" cy="360" r="9" fill="#666"/><text x="288" y="340">RX</text>
      <circle cx="336" cy="360" r="9" fill="#c9a43a"/><text x="336" y="340">VDD3V3</text>
      <circle cx="384" cy="360" r="9" fill="#c9a43a"/><text x="384" y="340">GND</text>
      <circle cx="432" cy="360" r="9" fill="#c9a43a"/><text x="432" y="340">IO22</text>
      <circle cx="480" cy="360" r="9" fill="#c9a43a"/><text x="480" y="340">IO21</text>
      <circle cx="528" cy="360" r="9" fill="#666"/><text x="528" y="340">IO23</text>
      <circle cx="576" cy="360" r="9" fill="#666"/><text x="576" y="340">IO19</text>
      <circle cx="624" cy="360" r="9" fill="#666"/><text x="624" y="340">IO18</text>
      <circle cx="672" cy="360" r="9" fill="#666"/><text x="672" y="340">IO5</text>
      <circle cx="720" cy="360" r="9" fill="#666"/><text x="720" y="340">IO39</text>
      <circle cx="768" cy="360" r="9" fill="#666"/><text x="768" y="340">IO36</text>
      <circle cx="816" cy="360" r="9" fill="#666"/><text x="816" y="340">IO0</text>
      <circle cx="864" cy="360" r="9" fill="#666"/><text x="864" y="340">RST</text>
      <circle cx="912" cy="360" r="9" fill="#666"/><text x="912" y="340">GND</text>
      <circle cx="960" cy="360" r="9" fill="#666"/><text x="960" y="340">VBUS</text>
    </g>
  </g>

  <!-- LIS3DH -->
  <rect x="230" y="560" width="560" height="90" rx="8" fill="#1f4fb3"/>
  <text x="510" y="640" text-anchor="middle" font-size="16" fill="#fff">LIS3DH (módulo azul)</text>
  <g font-size="13" fill="#fff" text-anchor="middle">
    <circle cx="260" cy="580" r="9" fill="#c9a43a"/><text x="260" y="608">VCC</text>
    <circle cx="310" cy="580" r="9" fill="#c9a43a"/><text x="310" y="608">GND</text>
    <circle cx="360" cy="580" r="9" fill="#c9a43a"/><text x="360" y="608">SCL</text>
    <circle cx="410" cy="580" r="9" fill="#c9a43a"/><text x="410" y="608">SDA</text>
    <circle cx="460" cy="580" r="9" fill="#c9a43a"/><text x="460" y="608">SDO</text>
    <circle cx="510" cy="580" r="9" fill="#c9a43a"/><text x="510" y="608">CS</text>
    <circle cx="560" cy="580" r="9" fill="#777"/><text x="560" y="608">INT2</text>
    <circle cx="610" cy="580" r="9" fill="#c9a43a"/><text x="610" y="608">INT1</text>
    <circle cx="660" cy="580" r="9" fill="#777"/><text x="660" y="608">ADC1</text>
    <circle cx="710" cy="580" r="9" fill="#777"/><text x="710" y="608">ADC2</text>
    <circle cx="760" cy="580" r="9" fill="#777"/><text x="760" y="608">ADC3</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="240,160 240,100 150,100 150,520 260,520 260,580" stroke="#e02020"/>
    <polyline points="288,160 288,85 130,85 130,535 310,535 310,580" stroke="#111"/>
    <polyline points="432,160 432,110 1060,110 1060,545 610,545 610,580" stroke="#1a9b3a"/>
    <polyline points="336,360 336,420 510,420 510,580" stroke="#ff7a00"/>
    <polyline points="384,360 384,445 460,445 460,580" stroke="#555"/>
    <polyline points="432,360 432,470 360,470 360,580" stroke="#e0b800"/>
    <polyline points="480,360 480,495 410,495 410,580" stroke="#2a6fe0"/>
  </g>

  <!-- legend -->
  <g font-size="15">
    <text x="830" y="585">1  VCC  → V3V3</text>
    <text x="830" y="605">2  GND  → GND (arriba)</text>
    <text x="830" y="625">3  SCL  → IO22</text>
    <text x="830" y="645">4  SDA  → IO21</text>
    <text x="830" y="665">5  SDO  → GND (abajo)</text>
    <text x="830" y="685">6  CS   → VDD3V3</text>
    <text x="830" y="705">7  INT1 → IO34</text>
  </g>
  <text x="230" y="700" font-size="14" fill="#555">INT2 y ADC1–3: sin conectar.</text>
</svg>

[package]
name = "guardian-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Guardian device -> backend contract v2: HKDF keys, HMAC signature, event envelope. no_std, byte-identical to guardian/protocol.py."
license = "UNLICENSED"
publish = false

[dependencies]
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

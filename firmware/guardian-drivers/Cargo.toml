[package]
name = "guardian-drivers"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "HAL-agnostic device drivers for Guardian (embedded-hal 1.0): LIS3DH, INA219, AT line framing."
license = "UNLICENSED"
publish = false

[dependencies]
guardian-core = { path = "../guardian-core" }
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal = "1.0"
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

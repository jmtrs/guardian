name: Guardian CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m compileall -q guardian tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Local simulation smoke test
        run: python -m guardian.demo

  firmware-host:
    name: Firmware core + drivers (host)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [guardian-core, guardian-drivers]
    defaults:
      run:
        working-directory: firmware/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  firmware-esp32:
    name: Firmware bring-up (xtensa-esp32-espidf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/bringup
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            firmware/bringup/target
          key: esp32-${{ hashFiles('firmware/**/Cargo.toml', 'firmware/bringup/sdkconfig.defaults') }}
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate
      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter backend run test
      - name: Build
        run: pnpm --filter backend run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter mobile exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter mobile run test

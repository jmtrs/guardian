name: Guardian CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  bench:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m compileall -q guardian tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Local simulation smoke test
        run: python -m guardian.demo

  firmware-host:
    name: Firmware protocol + core + drivers (host)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [guardian-protocol, guardian-core, guardian-drivers, guardian-device]
    defaults:
      run:
        working-directory: firmware/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  firmware-security-template:
    name: Firmware security config gate (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash firmware/production/check-security-config.sh firmware/production/sdkconfig.security.defaults template

  firmware-esp32:
    name: Firmware ${{ matrix.crate }} (${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: bringup
            chip: esp32
          - crate: production
            chip: esp32
          - crate: power-bench
            chip: esp32s3
    defaults:
      run:
        working-directory: firmware/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: ${{ matrix.chip }}
          ldproxy: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.espressif
            firmware/${{ matrix.crate }}/target
          key: ${{ matrix.chip }}-${{ hashFiles('firmware/**/Cargo.toml', format('firmware/{0}/sdkconfig.defaults', matrix.crate), format('firmware/{0}/partitions.csv', matrix.crate)) }}
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - name: Validate production partition table
        if: matrix.crate == 'production'
        run: |
          python "$HOME/.espressif/esp-idf/v5.4.2/components/partition_table/gen_esp32part.py" partitions.csv /tmp/guardian-partitions.bin
          cmp /tmp/guardian-partitions.bin target/xtensa-esp32-espidf/release/partition-table.bin

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://guardian:guardian@localhost:5432/guardian_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate
      - name: Production dependency audit
        run: pnpm run audit:prod
      - name: Lint
        run: pnpm --filter backend run lint
      - name: Script syntax
        run: pnpm run check:scripts
      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter backend run test
      - name: Apply migrations to test database
        run: pnpm --filter backend exec prisma migrate deploy
      - name: PostgreSQL integration tests
        run: pnpm --filter backend run test:e2e --runInBand
      - name: Build
        run: pnpm --filter backend run build
      - name: Built application smoke test
        run: pnpm --filter backend run smoke:built

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Resolve Expo configuration
        run: pnpm --filter mobile exec expo config --type public >/dev/null
      - name: Lint
        run: pnpm --filter mobile run lint
      - name: Typecheck
        run: pnpm --filter mobile exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter mobile run test
